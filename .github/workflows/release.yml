name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ManagedCode.LlmTck.slnx

      - name: Format
        run: dotnet format ManagedCode.LlmTck.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ManagedCode.LlmTck.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ManagedCode.LlmTck.Tests/ManagedCode.LlmTck.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Pack
        run: for project in src/*/*.csproj; do dotnet pack "$project" --configuration Release --no-build --output artifacts/packages; done

      - name: Publish packages
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
